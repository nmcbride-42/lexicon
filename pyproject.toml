[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexicon"
version = "0.1.0"
description = "A preregistered test of whether learned weights compress a reusable grammar of non-additive cellular perturbation response."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nick McBride" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
]

[project.optional-dependencies]
# only needed to rebuild the pseudobulk from the raw GEO files
data = ["scanpy>=1.9", "anndata>=0.10", "scikit-misc>=0.3"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["lexicon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: trains the model (planted controls, end-to-end evaluator); deselect with -m 'not slow'",
]
